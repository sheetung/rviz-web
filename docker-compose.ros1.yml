# Separate deployment: docker compose -f docker-compose.ros1.yml up --build -d
services:
  rvizweb-ros1:
    image: rvizweb:ros1
    build:
      context: .
      dockerfile: Dockerfile.ros1
      args:
        VITE_APP_TITLE: ${VITE_APP_TITLE:-RVizWeb}
        VITE_RVIZWEB_CONFIG: ${RVIZWEB_CONFIG:-default.rvizweb}
    network_mode: host
    init: true
    restart: unless-stopped
    environment:
      ROS_MASTER_URI: ${ROS_MASTER_URI:?Set ROS_MASTER_URI in .env}
      ROS_IP: ${ROS_IP:?Set ROS_IP to this machine's reachable address}
      CORS_ORIGINS: http://${ROS_IP}:3000,http://localhost:3000,http://127.0.0.1:3000
      ROS_SUBSCRIBE_TOPIC_ALLOWLIST: ${ROS_SUBSCRIBE_TOPIC_ALLOWLIST:-*}
      ROS_PUBLISH_TOPIC_ALLOWLIST: ${ROS_PUBLISH_TOPIC_ALLOWLIST:-/goal_pose,/initialpose,/cmd_vel}
    volumes:
      - ./rvizweb_configs:/app/rvizweb_configs
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"
    stop_grace_period: 10s
