# Example only: two separate ROS backend processes, listening on loopback.
# Install within an existing protected server block; UI served separately.
# Default /ws and /api use ROS2 here. Keep WS and HTTP pairs together.
location ~ ^/(ws/ros1$|ros1/api/) {
    proxy_pass http://127.0.0.1:18081;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header Origin $http_origin;
    proxy_read_timeout 3600s;
    proxy_buffering off;
}
location ~ ^/(ws(/ros2)?$|ros2/api/|api/) {
    proxy_pass http://127.0.0.1:18082;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header Origin $http_origin;
    proxy_read_timeout 3600s;
    proxy_buffering off;
}
